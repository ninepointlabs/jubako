[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jubako"
version = "0.4.5"
description = "A simple desktop database for Omarchy Linux, in the spirit of Microsoft Access."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Nine Point Labs" }]
keywords = ["omarchy", "database", "qml", "qt", "sqlite", "mcp"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Database :: Front-Ends",
]

# The core library and the MCP server need nothing but Python's own modules.
dependencies = []

[project.optional-dependencies]
# The window. PySide6 is best installed from Arch (`pyside6`, which pulls in
# qt6-declarative); it is listed here so the requirement is written down.
app = ["PySide6>=6.6"]
xlsx = ["openpyxl>=3.1"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1.1"]
dev = ["pytest>=9.0.3", "openpyxl>=3.1"]

[project.scripts]
jubako = "jubako.cli:main"
jubako-mcp = "jubako_mcp.server:main"

[project.gui-scripts]
jubako-app = "jubako_app.main:main"

[project.urls]
Homepage = "https://github.com/ninepointlabs/jubako"

[tool.hatch.build.targets.wheel]
packages = ["src/jubako", "src/jubako_app", "src/jubako_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
